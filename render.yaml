services:
  - type: web
    name: bankroll-v22-api-football-gateway
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: API_FOOTBALL_KEY
        sync: false
      - key: GATEWAY_TOKEN
        sync: false
      - key: CHATGPT_BRIDGE_TOKEN
        sync: false
      - key: CHATGPT_MCP_TOKEN
        sync: false
      - key: API_DAILY_LIMIT
        value: "90"
      - key: CACHE_TTL_SECONDS
        value: "900"
      - key: ACTIVE_CORE
        value: v22
